# Home Assistant dashboard for the Addams Family translite (TRANSLITE-1).
# Built-in cards plus our own mixer card (www/translite-mixer-card.js, no HACS).
# Needs Home Assistant 2024.10 or newer (sections view, heading and tile cards).
#
# Install:
#   1. Copy www/translite-mixer-card.js to /config/www/ on Home Assistant
#      (File editor or Studio Code Server add-on, or Samba).
#   2. Settings > Dashboards > three dots (top right) > Resources >
#      + Add resource: URL /local/translite-mixer-card.js,
#      type "JavaScript module" > Create. (No Resources menu? Turn on
#      Advanced mode in your user profile.)
#   3. Settings > Dashboards > + Add dashboard > New dashboard from scratch,
#      name "Translite", icon mdi:ghost > Create. Open it, pencil (edit) >
#      three dots > Raw configuration editor > replace everything with this
#      file > Save.
#   4. Refresh the browser (Ctrl+F5) so it loads the mixer card.
#   After updating the .js file later, refresh again; if the old card stays,
#   change the resource URL to /local/translite-mixer-card.js?v=2.
#
# Entity ids are the ones Home Assistant makes from the names in
# translite.yaml (e.g. "Translite radio" -> switch.translite_radio). If
# yours differ, check Settings > Entities, search "translite".

title: Translite
views:
  - title: Translite
    path: translite
    icon: mdi:ghost
    type: sections
    max_columns: 4
    sections:

      # ---------- header + what is playing ----------
      - type: grid
        cards:
          - type: heading
            heading: The Addams Family
            heading_style: title
            icon: mdi:ghost
          - type: markdown
            content: >-
              {% set online = states('switch.translite_backlight') not in ['unavailable', 'unknown'] %}
              {% if online %}🟢 **Translite online**{% else %}🔴 **Translite offline**{% endif %}
              &nbsp;·&nbsp; backlight **{{ states('sensor.translite_backlight_brightness') }}** / 154
              &nbsp;·&nbsp; master **{{ states('number.translite_master_volume') | int(0) }}** / 63

              {% if is_state('switch.translite_addams_music', 'on') %}🎹 *They're creepy and they're kooky…* the Addams music is playing
              {%- elif is_state('switch.translite_radio', 'on') %}📻 London Tower Block Radio is playing quietly
              {%- else %}🤫 All quiet in the mansion{% endif %}
          - type: tile
            entity: switch.translite_addams_music
            name: Addams music
            icon: mdi:hand-clap
            color: deep-purple
            vertical: true
            tap_action:
              action: toggle
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: switch.translite_radio
            name: Radio
            icon: mdi:radio
            color: teal
            vertical: true
            tap_action:
              action: toggle
            grid_options:
              columns: 6
              rows: 2

      # ---------- mixer ----------
      - type: grid
        cards:
          - type: heading
            heading: Mixer
            icon: mdi:tune-vertical
          # vertical faders: Addams music and radio on the Pi, master = amplifier
          - type: custom:translite-mixer-card
            title: ""
            grid_options:
              columns: 12
              rows: 6

      # ---------- lights ----------
      - type: grid
        cards:
          - type: heading
            heading: Lights
            icon: mdi:television-ambient-light
          - type: tile
            entity: switch.translite_backlight
            name: Backlight
            icon: mdi:television-ambient-light
            color: amber
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: tile
            entity: switch.translite_blink_effects
            name: Spooky blinks
            icon: mdi:flash
            color: orange
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: tile
            entity: number.translite_backlight_level
            name: Backlight level
            icon: mdi:brightness-6
            color: amber
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          - type: tile
            entity: light.translite_external_ch1
            name: External CH1
            features:
              - type: light-brightness
            grid_options:
              columns: 12

      # ---------- schedule + sensors ----------
      - type: grid
        cards:
          - type: heading
            heading: Daily show & sensors
            icon: mdi:clock-time-twelve-outline
          - type: tile
            entity: switch.translite_daily_music
            name: Music every day at 12:00
            icon: mdi:calendar-clock
            color: deep-purple
            tap_action:
              action: toggle
            grid_options:
              columns: 12
          - type: gauge
            entity: sensor.translite_backlight_brightness
            name: Backlight now
            min: 0
            max: 154
            # 154 is the hard cap on the Pi, so a full gauge is normal in a bright room
            segments:
              - from: 0
                color: "#ffb300"
            grid_options:
              columns: 6
              rows: 3
          - type: entity
            entity: sensor.translite_light_sensor
            name: Light sensor (high = dark)
            icon: mdi:brightness-percent
            grid_options:
              columns: 6
              rows: 3
          - type: history-graph
            title: Last 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.translite_backlight_brightness
                name: Backlight
              - entity: sensor.translite_light_sensor
                name: Light sensor
            grid_options:
              columns: 12
